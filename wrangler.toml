name = "jade-room"
main = "worker.js"
compatibility_date = "2026-06-01"
workers_dev = true

# Alamat server: room.mahjongjogja.com (DNS-nya dibuat otomatis oleh Cloudflare)
routes = [
  { pattern = "room.mahjongjogja.com", custom_domain = true }
]

# Pembaca foto tiles (gratis 10.000 neuron/hari). Opsional: secret GEMINI_API_KEY untuk Gemini.
[ai]
binding = "AI"

[vars]
ALLOW_ORIGINS = "https://mahjongjogja.com,https://www.mahjongjogja.com"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
